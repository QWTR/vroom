plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vroomofflinenavigation'
version = '1.0.0'

android {
  namespace "expo.modules.vroomofflinenavigation"
  defaultConfig { versionCode 1; versionName "1.0.0" }
}

dependencies {
  implementation "com.mapbox.navigationcore:android-ndk27:3.18.0"
  implementation "com.mapbox.maps:android-ndk27:11.18.2"
}
